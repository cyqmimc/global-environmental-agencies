name: Quarterly Data Update

# Runs the data-maintenance pipeline once per quarter and opens a PR for review.
# Manual `workflow_dispatch` button is also exposed for ad-hoc runs.

on:
  schedule:
    # 02:00 UTC on the 1st of Jan/Apr/Jul/Oct
    - cron: "0 2 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch World Bank + UN SDG + split + check
        run: npm run update-all

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/wb-latest.json public/wb-history.json public/sdg-latest.json public/countries-core.json public/countries-detail.json public/og-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-refresh/${{ github.run_id }}
          title: "chore(data): quarterly refresh from World Bank and UN SDG"
          commit-message: "chore(data): quarterly refresh from World Bank and UN SDG"
          body: |
            Automated quarterly data refresh.

            - Ran `npm run update-all`
            - Review the diff for any unexpected jumps before merging
            - IQAir PM2.5 overrides should be preserved (fetch script handles this)
            - UN SDG values use each series' latest common official data year
          labels: |
            data
            automated
